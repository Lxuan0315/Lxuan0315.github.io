      --text: #1f2329;
      --text-sub: #8a90a0;

      --panel: #1c1f26;
      --border: #2a2e38;
      --border-hover: #3d4453;
      --text: #e7eaf2;
      --text-sub: #8b93a6;
      --text-mid: #a8b0c2;
      --primary: #5b8cff;
      --primary-2: #7aa2ff;
      --primary-soft: rgba(91, 140, 255, 0.14);
      --primary-ring: rgba(91, 140, 255, 0.24);
      --hover: #242833;
      --seg-bg: #232733;
      --dot: #454b5c;
      --kind-bg: #242833;
      --kind-text: #9aa3b5;
      --chip-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      --logo-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
      --dl-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.28);

      color-scheme: dark;

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Helvetica Neue", sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);

    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* ===== 左上角菜单 ===== */
    .sidebar {
      position: sticky;
      top: 0;
      align-self: flex-start;
      width: 236px;
      flex: 0 0 236px;
      height: 100vh;
      padding: 22px 16px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 6px;
    }

    .brand .logo {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--logo-shadow);
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .menu-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: var(--text-sub);
      padding: 0 10px 6px;
      text-transform: uppercase;
    }

    .menu-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .menu-item .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dot);
      flex: 0 0 8px;
      transition: background 0.18s ease, box-shadow 0.18s ease;
    }

    .menu-item:hover {
      background: var(--hover);
    }

    .menu-item.active {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 600;
    }

    .menu-item.active .dot {
      background: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-ring);
    }

    .side-foot {
      margin-top: auto;
      font-size: 12px;
      color: var(--text-sub);
      padding: 0 10px;
    }

      background: transparent;
      color: var(--text-mid);
      font-size: 12px;
      font-family: inherit;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;

    .seg-btn:hover {

    }

    .seg-btn.active {

      color: var(--primary);
      font-weight: 600;
      box-shadow: var(--chip-shadow);

      min-width: 0;
      padding: 34px 40px 48px;
      display: flex;
      flex-direction: column;

      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .head h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .head p {
      margin-top: 6px;
      font-size: 13px;
      color: var(--text-sub);
    }

    .count {
      font-size: 12px;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px solid var(--primary-ring);
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;

      gap: 4px;
      padding: 4px;
      background: var(--seg-bg);
      border-radius: 12px;
      margin-bottom: 20px;
      align-self: flex-start;
    }

    .chips.hidden {
      display: none;
    }

    .chip {
      border: 0;
      padding: 8px 16px;
      border-radius: 9px;
      background: transparent;
      color: var(--text-mid);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;

    .chip:hover {
      color: var(--text);
    }

    .chip.active {
      background: var(--panel);
      color: var(--primary);
      font-weight: 600;
      box-shadow: var(--chip-shadow);
    }

    .list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      animation: rise 0.34s ease both;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-hover);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card .info {
      min-width: 0;
      flex: 1 1 auto;
    }

    .card .ver {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #fff;
      background: linear-gradient(135deg, #ff8a3d 0%, #ff6b35 100%);
      padding: 3px 7px;
      border-radius: 6px;
    }

    .card .meta {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-sub);
      display: flex;
      gap: 10px;
    }

      background: var(--kind-bg);
      color: var(--kind-text);
      padding: 1px 7px;
      border-radius: 5px;
    }

    .card .meta .mini {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 7px;
      border-radius: 5px;
      border: 1px solid var(--primary-ring);
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: filter 0.18s ease;
    }

    .card .meta .mini:hover {
      filter: brightness(1.05);
    }

    .notice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-left: 3px solid #ff8a3d;
      border-radius: 10px;
      background: var(--panel);
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-mid);

    .notice b {

      font-weight: 600;

    .notice a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .notice a:hover {

      color: var(--kind-text);

      padding: 9px 15px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: var(--dl-shadow);
      transition: filter 0.18s ease, transform 0.18s ease;
    }

    .dl:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .dl:active {
      transform: translateY(0);
    }

    .dl svg {
      width: 14px;
      height: 14px;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 48px;
      text-align: center;
      color: var(--text-sub);
      font-size: 14px;
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: var(--radius);

    .footer {

      padding-top: 34px;
      font-size: 12px;
      color: var(--text-sub);
    }

    /* ===== 响应式 ===== */
    @media (max-width: 820px) {
      .app {
        flex-direction: column;
      }

      .sidebar {
        position: static;
        width: 100%;
        flex: 0 0 auto;
        height: auto;
        flex-direction: row;
        align-items: center;
        gap: 16px;
        padding: 12px 16px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
      }

      .brand-sub,
      .menu-title,
      .side-foot {
        display: none;
      }

      .menu {
        flex-direction: row;
      }

      .menu-item {
        width: auto;
        white-space: nowrap;
      }

      .theme,
      .seg {
        flex: 0 0 auto;
      }

      .main {
        padding: 22px 18px 36px;
      }

      .head h1 {
        font-size: 20px;
      }

      .list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function buildItems() {
      var items = [];

      if (state.cat === "java") {
        var isJar = state.sub === "jar";
        var dir = isJar ? JAR_DIR : SRC_DIR;
        var ext = isJar ? ".jar" : ".zip";
        JAVA_VERSIONS.forEach(function (v) {
          items.push({ ver: v, path: dir + "/" + v + ext, kind: isJar ? "JAR" : "ZIP" });
        });
      } else if (state.sub === "app") {
        EXE_FILES.forEach(function (it) {
          items.push({ ver: it.n, path: EXE_DIR + "/" + it.f, kind: "EXE" });
        });
      } else {
        SB3_FILES.forEach(function (it) {
          items.push({ ver: it.n, path: SB3_DIR + "/" + it.f, kind: "SB3" });
        });
      }

      // 最新的排在最前面
      return items.reverse();
    }

    function renderChips() {
      var box = document.getElementById("chips");
      box.innerHTML = META[state.cat].subs
        .map(function (s) {
          return (
            '<button class="chip' + (s.key === state.sub ? " active" : "") +
            '" data-sub="' + s.key + '">' + esc(s.label) + "</button>"
          );
        })
        .join("");
      Array.prototype.forEach.call(box.querySelectorAll(".chip"), function (btn) {
        btn.addEventListener("click", function () {
          state.sub = btn.dataset.sub;
          render();
        });
      });
    }

    function render() {
      var meta = META[state.cat];
      var items = buildItems();
      var total = items.length;
      var sub = meta.subs.filter(function (s) {
        return s.key === state.sub;
      })[0];

      document.getElementById("page-title").textContent = meta.title;
      document.getElementById("page-desc").textContent = sub ? sub.desc : meta.desc;
      document.getElementById("count").textContent = "共 " + total + " 个版本";
      renderChips();

      var needRt =
        state.cat === "java" &&
        items.some(function (it) {
          return needRuntime(it.ver);
        });

      var notice = "";
      if (needRt) {
        notice =
          state.sub === "src"
            ? '<div class="notice"><div>WinLLx <b>3.0.0 / 3.0.1</b> 的源码需要 JetBrains Runtime（含 JCEF 与 javac）才能编译，' +
              "普通 JDK 编译不出来 —— 可点卡片上的「运行环境」下载完整包。" +
              "<b>2.x 版本不受影响</b>。</div></div>"
            : '<div class="notice"><div>WinLLx <b>3.0.0 / 3.0.1</b> 是用 JetBrains Runtime（含 JCEF 浏览器内核）编译的，' +
              "普通 JDK 无法运行，因此这两个版本直接提供 <b>完整包</b>（已内含运行环境，约 270MB）：" +
              "解压后双击 <code>run.bat</code> 即可运行。" +
              "若你已有运行环境，也可点卡片上的「仅 jar」只下 jar。" +
              "<b>2.x 版本不需要</b>完整包。</div></div>";
      }

      var list = document.getElementById("list");
      list.innerHTML =
        notice +
        items
          .map(function (it, i) {
            var isLatest = i === 0;
            var delay = Math.min(i * 18, 260);
            var isRt = state.cat === "java" && needRuntime(it.ver);
            var isFull = isRt && state.sub === "jar";
            var href = isFull ? fullPkgUrl(it.ver) : toUrl(it.path);
            var mini = "";
            if (isRt) {
              mini = isFull
                ? '<a class="mini" href="' + esc(toUrl(it.path)) + '" download>仅 jar</a>'
                : '<a class="mini" href="' + esc(fullPkgUrl(it.ver)) + '" target="_blank" rel="noopener">运行环境</a>';
            }
            return (
              '<div class="card" style="animation-delay:' + delay + 'ms">' +
              '<div class="info">' +
              '<div class="ver">' +
              esc(it.ver) +
              (isLatest ? '<span class="tag">最新</span>' : "") +
              "</div>" +
              '<div class="meta"><span class="kind">' +
              esc(isFull ? "完整包" : it.kind) +
              "</span>" +
              mini +
              "</div>" +
              "</div>" +
              '<a class="dl" href="' +
              esc(href) +
              '"' +
              (isFull ? ' target="_blank" rel="noopener"' : " download") +
              ">" +
              ICON_DL +
              "下载</a>" +
              "</div>"
            );
          })
          .join("");
    }

    document.querySelectorAll(".menu-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".menu-item").forEach(function (b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
        state.cat = btn.dataset.cat;
        state.sub = META[state.cat].subs[0].key;
        render();
      });
    });

    render();

    /* ===== 外观：浅色 / 深色 / 跟随系统 ===== */
    var THEME_KEY = "winllx-theme";
    var mq = window.matchMedia("(prefers-color-scheme: dark)");

    function themeMode() {
      try {
        return localStorage.getItem(THEME_KEY) || "system";
      } catch (e) {
        return "system";
      }
    }

    function applyTheme(mode) {
      var dark = mode === "dark" || (mode === "system" && mq.matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      Array.prototype.forEach.call(document.querySelectorAll(".seg-btn"), function (b) {
        b.classList.toggle("active", b.dataset.mode === mode);
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll(".seg-btn"), function (btn) {
      btn.addEventListener("click", function () {
        try {
          localStorage.setItem(THEME_KEY, btn.dataset.mode);
        } catch (e) {}
        applyTheme(btn.dataset.mode);
      });
    });

    function onSchemeChange() {
      if (themeMode() === "system") applyTheme("system");
    }

    if (mq.addEventListener) mq.addEventListener("change", onSchemeChange);
    else if (mq.addListener) mq.addListener(onSchemeChange);

    applyTheme(themeMode());
  </script>
</body>
</html>
