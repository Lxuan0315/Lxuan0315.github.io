<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>前端空壳</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --border: #e5e7eb;
      --text: #1f2329;
      --text-sub: #8a8f99;
      --primary: #3370ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航 */
    .header {
      height: 56px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .header .logo {
      font-size: 16px;
      font-weight: 600;
    }

    .header .nav {
      display: flex;
      gap: 20px;
    }

    .header .nav a {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 14px;
    }

    .header .nav a:hover {
      color: var(--primary);
    }

    /* 主体区域 */
    .body {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
    }

    .sidebar {
      width: 220px;
      flex: 0 0 auto;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 16px;
    }

    .main {
      flex: 1 1 auto;
      padding: 24px;
      overflow: auto;
    }

    .main .placeholder {
      height: 100%;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      font-size: 14px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    /* 底部 */
    .footer {
      height: 40px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-sub);
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <div class="logo">Logo</div>
    <nav class="nav">
      <a href="#">首页</a>
      <a href="#">功能</a>
      <a href="#">关于</a>
    </nav>
  </header>

  <!-- 主体 -->
  <div class="body">
    <aside class="sidebar">
      <!-- 侧边栏内容占位 -->
    </aside>
    <main class="main">
      <div class="placeholder">内容区域</div>
    </main>
  </div>

  <!-- 底部 -->
  <footer class="footer">© 2026 Frontend Shell</footer>

  <script>
    // 页面逻辑占位
    document.addEventListener("DOMContentLoaded", function () {
      console.log("前端空壳已加载");
    });
  </script>
</body>
</html>
